title: Tiny glossary (we'll reuse these all lecture)

text:
  bullets:
    - "**Mental lexicon**: your internal 'word store'"
    - "**Lexical access**: getting from print/sound to the right word entry"
    - "**RT (reaction time)**: how long a response takes"
    - "**Priming**: one stimulus changes response to the next"
    - "**Morphology**: meaningful word parts (teach+er)"
    - "**Frequency**: how common a word is"
    - "**Neighbourhood/similarity**: how many 'lookalikes' a word has"
    - "**Model**: an explanation that predicts data patterns"

visual: |
  Clean table layout with teal header, charcoal text. High contrast.
